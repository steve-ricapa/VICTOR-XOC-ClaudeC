[project]
name = "victor-agent"
version = "0.1.0"
description = "VICTOR On-Premise Agent secure execution runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7.0",
  "PyYAML>=6.0.1",
  "claude-agent-sdk>=0.1.61",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["runtime", "config"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "playbooks*"]
exclude = ["tests*", "config*", "runtime*", "skills*", "mcp*"]
namespaces = false

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
